name: Build and Release CLI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          token: ${{ github.token }}

      - name: Install dependencies
        run: bun install

      - name: Install web-ui deps
        run: bun install --cwd packages/web-ui

      - name: Build web UI
        run: bun run build:web

      - name: Typecheck
        run: bun run typecheck

      - name: Test suite
        run: bun test

  build:
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: ode-linux-x64
          - os: windows-latest
            target: bun-windows-x64
            artifact: ode-windows-x64.exe
          - os: macos-15-intel
            target: bun-darwin-x64
            artifact: ode-darwin-x64
          - os: macos-14
            target: bun-darwin-arm64
            artifact: ode-darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          token: ${{ github.token }}

      - name: Install dependencies
        run: bun install

      - name: Install web-ui deps
        run: bun install --cwd packages/web-ui

      - name: Build web UI
        run: bun run build:web

      - name: Embed web UI assets
        run: bun run embed:web

      - name: Build CLI
        run: bun build packages/core/cli.ts --compile --target ${{ matrix.target }} --outfile dist/${{ matrix.artifact }}

      - name: Import macOS Developer ID certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${MACOS_CERTIFICATE_P12}" ]]; then
            echo "MACOS_CERTIFICATE_P12 is required for a stable Ode TCC identity" >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/ode-signing.keychain-db"
          certificate="$RUNNER_TEMP/ode-signing.p12"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p ode-ci "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p ode-ci "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k ode-ci "$keychain"

      - name: Build, sign, notarize, and package Ode.app
        if: runner.os == 'macOS'
        env:
          ODE_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_NOTARIZATION_ID: ${{ secrets.APPLE_NOTARIZATION_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          bin="dist/${{ matrix.artifact }}"
          if [[ -z "${ODE_CODESIGN_IDENTITY}" ]]; then
            echo "MACOS_CODESIGN_IDENTITY is required" >&2
            exit 1
          fi
          if [[ -z "${APPLE_NOTARIZATION_ID}" || -z "${APPLE_NOTARIZATION_PASSWORD}" || -z "${APPLE_TEAM_ID}" ]]; then
            echo "APPLE_NOTARIZATION_ID, APPLE_NOTARIZATION_PASSWORD, and APPLE_TEAM_ID are required" >&2
            exit 1
          fi
          app_output="$RUNNER_TEMP/ode-app"
          ODE_CLI_BINARY="$bin" \
            ODE_APP_ARCH="$(uname -m)" \
            ODE_CODESIGN_IDENTITY="$ODE_CODESIGN_IDENTITY" \
            ODE_BUILD_NUMBER="${GITHUB_RUN_NUMBER}" \
            ./scripts/build-ode-app.sh "$app_output"
          codesign --verify --deep --strict --verbose=2 "$app_output/Ode.app"

          notarization_archive="$RUNNER_TEMP/ode-notarization.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app_output/Ode.app" "$notarization_archive"
          xcrun notarytool submit "$notarization_archive" \
            --apple-id "$APPLE_NOTARIZATION_ID" \
            --password "$APPLE_NOTARIZATION_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 30m
          xcrun stapler staple "$app_output/Ode.app"
          xcrun stapler validate "$app_output/Ode.app"
          spctl --assess --type execute --verbose=4 "$app_output/Ode.app"

          ditto -c -k --sequesterRsrc --keepParent "$app_output/Ode.app" "dist/${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.zip

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ode-* > SHA256SUMS

      - name: Read version
        id: vars
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          current_tag="v${{ steps.vars.outputs.version }}"
          previous_tag="$(git tag --list 'v*' --sort=-version:refname | grep -vx "${current_tag}" | head -n 1 || true)"

          if [[ -n "${previous_tag}" ]]; then
            range="${previous_tag}..HEAD"
            summary_line="- Changes since \`${previous_tag}\`"
          else
            first_commit="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            range="${first_commit}..HEAD"
            summary_line="- Changes from initial commit"
          fi

          commit_count="$(git rev-list --count ${range})"

          {
            echo "body<<EOF"
            echo "## Summary"
            echo "- Release \`${current_tag}\`"
            echo "${summary_line}"
            echo "- Total commits: ${commit_count}"
            echo
            echo "## Commits"
            git log --pretty='- %h %s' ${range}
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.vars.outputs.version }}
          name: Ode CLI v${{ steps.vars.outputs.version }}
          prerelease: false
          body: ${{ steps.notes.outputs.body }}
          files: |
            dist/**/ode-*
            dist/SHA256SUMS
